name: China auth diagnostics
on:
  workflow_dispatch:
    inputs:
      probe_owner_handoff:
        description: Test the configured owner's handoff using a single-use diagnostic code (expires in 60 seconds)
        type: boolean
        default: false
      probe_learning:
        description: Also test live speech/cache, transcription, and AI coaching (requires owner handoff; small provider usage)
        type: boolean
        default: false
      warm_speech:
        description: Pre-generate missing normal/slow lesson audio (requires owner handoff; uses shared ElevenLabs credits)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Inspect auth configuration without exposing credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CHINA_CREW_EMAILS: ${{ secrets.CHINA_CREW_EMAILS }}
          RUN_OWNER_HANDOFF_PROBE: ${{ inputs.probe_owner_handoff }}
          RUN_LEARNING_PROBE: ${{ inputs.probe_learning }}
          RUN_SPEECH_WARMUP: ${{ inputs.warm_speech }}
        run: node projects/china/scripts/auth-diagnostics.mjs
