name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: [self-hosted, linux, homelab, templar-labs]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Run checks
        run: pnpm check
