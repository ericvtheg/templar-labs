name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy projects
    runs-on: [self-hosted, linux, homelab, templar-labs]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Run checks
        run: pnpm check

      - name: Deploy projects
        env:
          ALCHEMY_CI_STATE_STORE_CHECK: "false"
        run: pnpm run deploy
