name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      refresh_sources:
        description: Reload Property Watch sources during deployment
        type: boolean
        default: true
      project:
        description: Project to deploy
        type: choice
        required: true
        default: all
        options:
          - all
          - emma-eric-wedding
          - la-property-watch
          - templar-auth

concurrency:
  group: deploy-main
  queue: max

jobs:
  deploy:
    name: Deploy projects
    runs-on: ubuntu-24.04
    concurrency:
      group: la-property-ingestion
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Verify retired Hello World resources
        if: inputs.project == 'la-property-watch'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/verify-hello-world-retirement.py after

      - name: Run checks
        run: |
          if [ "${{ inputs.project }}" = "la-property-watch" ]; then
            pnpm check:monorepo
            pnpm format:check
            pnpm exec biome lint projects/la-property-watch
            pnpm --filter la-property-watch check
            pnpm --filter la-property-watch-web typecheck
          elif [ "${{ inputs.project }}" = "templar-auth" ]; then
            pnpm --filter @templar/auth check
            pnpm --filter templar-auth-web check
          else
            pnpm check
          fi

      - name: Verify LA built-Worker UI
        if: inputs.project == 'la-property-watch'
        run: |
          pnpm --filter la-property-watch-web exec playwright install --with-deps chromium
          pnpm --filter la-property-watch-web test:e2e

      - name: Run database migrations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ "${{ inputs.project }}" = "emma-eric-wedding" ]; then
            pnpm db:migrate:prod emma-eric-wedding
          elif [ "${{ inputs.project }}" = "la-property-watch" ]; then
            pnpm db:migrate:prod la-property-watch
          elif [ "${{ inputs.project }}" = "templar-auth" ]; then
            pnpm db:migrate:prod templar-auth
          else
            pnpm db:migrate:ci
          fi

      - name: Deploy projects
        env:
          ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
          ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CHINA_CREW_EMAILS: ${{ secrets.CHINA_CREW_EMAILS }}
          ELEVENLABS_API_TOKEN: ${{ secrets.ELEVENLABS_API_TOKEN }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          OPENROUTER_API_TOKEN: ${{ secrets.OPENROUTER_API_TOKEN }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          POSTHOG_PROJECT_API_KEY: ${{ secrets.POSTHOG_PROJECT_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          TEMPLAR_AUTH_SECRET: ${{ secrets.TEMPLAR_AUTH_SECRET }}
          WEDDING_EDITOR_EMAILS: ${{ secrets.WEDDING_EDITOR_EMAILS }}
        run: |
          if [ "${{ inputs.project }}" = "emma-eric-wedding" ]; then
            pnpm --filter emma-eric-wedding run deploy
          elif [ "${{ inputs.project }}" = "la-property-watch" ]; then
            pnpm --filter la-property-watch run deploy
          elif [ "${{ inputs.project }}" = "templar-auth" ]; then
            pnpm --filter templar-auth run deploy
          elif [ "${{ github.event_name }}" = "push" ]; then
            pnpm run deploy -- --changed-since "${{ github.event.before }}"
          else
            pnpm run deploy
          fi

      - name: Inspect approved Property Watch identity mapping (read-only)
        if: inputs.project == 'templar-auth'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node --experimental-strip-types projects/la-property-watch/scripts/verify-auth-identities.ts

      - name: Verify wedding editor binding
        if: inputs.project == 'emma-eric-wedding'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          account = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          worker = "emma-eric-wedding-website"
          request = urllib.request.Request(
              f"https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts/{worker}/settings",
              headers={"Authorization": f"Bearer {os.environ['CLOUDFLARE_API_TOKEN']}"},
          )
          with urllib.request.urlopen(request) as response:
              payload = json.load(response)
          assert payload.get("success"), "Worker settings request failed"
          binding = next(
              (binding for binding in payload["result"]["bindings"]
               if binding["name"] == "WEDDING_EDITOR_EMAILS"),
              None,
          )
          assert binding and binding["type"] == "secret_text", "Missing editor secret binding"
          print(f"Verified {worker}: WEDDING_EDITOR_EMAILS is present as secret_text")
          PY

      - name: Upload prepared China audio
        if: inputs.project != 'emma-eric-wedding' && inputs.project != 'la-property-watch' && inputs.project != 'templar-auth'
        timeout-minutes: 20
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] && git diff --quiet "${{ github.event.before }}" "${{ github.sha }}" -- projects/china packages/deploy packages/auth pnpm-lock.yaml package.json .github/workflows/deploy.yml; then
            echo "China unchanged; prepared audio already deployed."
            exit 0
          fi
          pnpm --filter china audio:upload

      - name: Bootstrap LA Property Watch live sources
        if: inputs.project == 'la-property-watch' && inputs.refresh_sources
        timeout-minutes: 45
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node --experimental-strip-types projects/la-property-watch/scripts/ingest-production.ts

      - name: Verify LA Property Watch production
        if: inputs.project == 'la-property-watch'
        timeout-minutes: 15
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TEMPLAR_AUTH_SECRET: ${{ secrets.TEMPLAR_AUTH_SECRET }}
        run: |
          pnpm --filter la-property-watch-web exec node --experimental-strip-types scripts/verify-public-auth.ts
          node --experimental-strip-types projects/la-property-watch/scripts/verify-production.ts --read-only
          pnpm --filter la-property-watch-web exec node --experimental-strip-types scripts/verify-browser.ts

      - name: Upload LA production browser evidence
        if: always() && inputs.project == 'la-property-watch'
        uses: actions/upload-artifact@v4
        with:
          name: la-property-watch-production-browser
          path: projects/la-property-watch/apps/web/test/.results/production/*.png
          if-no-files-found: ignore
          retention-days: 7
