    <use href="#vein" transform="rotate(135 24 24)"/>
    <use href="#vein" transform="rotate(180 24 24)"/>
    <use href="#vein" transform="rotate(225 24 24)"/>
    <use href="#vein" transform="rotate(270 24 24)"/>
    <use href="#vein" transform="rotate(315 24 24)"/>
  </g>
